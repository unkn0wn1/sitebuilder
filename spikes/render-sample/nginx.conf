# Example nginx config for the spike output. Cache-Tag headers match ADR 0004.
# This file was not run in the spike environment (nginx is not installed here).
server {
  listen 80;
  server_name _;
  root /var/www/site/current;
  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;
  charset utf-8;

  add_header Cache-Tag "page-home shell" always;
  add_header Cache-Control "public, max-age=300" always;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location /media/ {
    add_header Cache-Tag "media" always;
    add_header Cache-Control "public, max-age=604800, immutable" always;
  }

  location = /theme.css {
    add_header Cache-Tag "shell" always;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location = /embed.js {
    add_header Cache-Tag "shell" always;
    add_header Cache-Control "public, max-age=604800" always;
  }
}
