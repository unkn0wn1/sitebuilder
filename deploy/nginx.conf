# Example origin config for a published site (ADR 0004). The builder writes
# cache-tags.map, csp.map, redirects.map and redirect-status.map into the live
# release. A small watcher in the nginx container should run `nginx -s reload`
# when `current` changes. The builder itself cannot change this file.
#
# Media lives outside the release folders and is served from /media/.

map $uri $redirect_to {
  include /srv/sitebuilder/current/redirects.map;
}

map $uri $redirect_status {
  include /srv/sitebuilder/current/redirect-status.map;
  default 301;
}

map $uri $cache_tags {
  include /srv/sitebuilder/current/cache-tags.map;
  default "shell";
}

map $uri $content_csp {
  include /srv/sitebuilder/current/csp.map;
  default "default-src 'self'; frame-ancestors 'none';";
}

server {
  listen 80;
  server_name _;
  root /srv/sitebuilder/current;
  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;
  charset utf-8;

  if ($redirect_to) {
    return $redirect_status $redirect_to;
  }

  add_header Cache-Tag $cache_tags always;
  add_header Content-Security-Policy $content_csp always;
  add_header Cache-Control "public, max-age=0, s-maxage=86400" always;

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location = /embed.js {
    add_header Cache-Tag "shell" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /analytics.js {
    add_header Cache-Tag "shell" always;
    add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
  }

  location /media/ {
    alias /srv/sitebuilder/media/renditions/;
    add_header Cache-Tag "media" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
