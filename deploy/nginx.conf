# Origin nginx for the public site and a reverse proxy for the builder (ADR 0004, ADR 0007).
# The builder writes cache-tags.map, csp.map, redirects.map and redirect-status.map
# into the live release. A watcher in this container reloads nginx when `current` changes.

map $uri $redirect_to {
  include /var/lib/sitebuilder/site/current/redirects.map;
}

map $uri $redirect_status {
  include /var/lib/sitebuilder/site/current/redirect-status.map;
  default 0;
}

map $uri $cache_tags {
  include /var/lib/sitebuilder/site/current/cache-tags.map;
  default "shell";
}

map $uri $content_csp {
  include /var/lib/sitebuilder/site/current/csp.map;
  default "default-src 'self'; frame-ancestors 'none';";
}

# 404 and 410 must not be stored at the edge. A page publish purges page-<id>,
# not a 404 that was cached under Cache-Tag: shell before the page existed.
map $status $edge_cache_control {
  default "public, max-age=0, s-maxage=86400";
  404 "no-store";
  410 "no-store";
}

# Public site, served from the current release.
server {
  listen 80;
  server_name ${PUBLIC_HOST};
  root /var/lib/sitebuilder/site/current;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  charset utf-8;
  # Stay on the visitor-facing scheme/host when adding a trailing slash.
  absolute_redirect off;

  # `return` only accepts a literal status code, so 301/302 are branched here
  # rather than `return $redirect_status`. Default 0 means "no redirect".
  if ($redirect_status = 302) {
    return 302 $redirect_to;
  }
  if ($redirect_status = 301) {
    return 301 $redirect_to;
  }

  add_header Cache-Tag $cache_tags always;
  add_header Content-Security-Policy $content_csp always;
  add_header Cache-Control $edge_cache_control always;

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location = /embed.js {
    add_header Cache-Tag "shell" always;
    add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
  }

  location = /header.js {
    add_header Cache-Tag "shell" always;
    add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
  }

  location = /analytics.js {
    add_header Cache-Tag "shell" always;
    add_header Cache-Control "public, max-age=0, s-maxage=3600" always;
  }

  location ~* ^/media/(.+\.svg)$ {
    alias /var/lib/sitebuilder/media/renditions/$1;
    default_type image/svg+xml;
    types { }
    add_header Cache-Tag "media" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
  }

  location /media/ {
    alias /var/lib/sitebuilder/media/renditions/;
    add_header Cache-Tag "media" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}

# Builder GUI and API. Cloudflare Access should be enabled on this hostname.
server {
  listen 80;
  server_name ${BUILDER_HOST};
  client_max_body_size 30m;
  include /etc/nginx/cloudflare-real-ip.conf;

  # Hashed Vite/Nitro assets can be cached forever. Admin HTML and API must not be,
  # or a browser can keep an old shell that still shows removed fields.
  location /_nuxt/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_pass http://builder:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://builder:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
  }
}
