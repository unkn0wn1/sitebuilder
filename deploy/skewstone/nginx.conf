# Skewstone public edge. Include this file from the http { } block.
# One listen per role, each default_server, so a private preview host on that port is served in place.
# Canonical links in the pages stay on the public hostnames.
# Copy deploy/cloudflare-real-ip.conf to /etc/nginx/cloudflare-real-ip.conf before reloading.

map $http_x_forwarded_proto $skew_forwarded_proto {
  "" $scheme;
  default $http_x_forwarded_proto;
}

map $status $skew_www_cache {
  default "public, max-age=0, s-maxage=86400";
  404 "no-store";
  410 "no-store";
}

map $status $skew_docs_html_cache {
  default "public, max-age=0, s-maxage=3600";
  404 "no-store";
  410 "no-store";
}

map $status $skew_docs_asset_cache {
  default "public, max-age=31536000, immutable";
  404 "no-store";
  410 "no-store";
}

map $status $skew_index_cache {
  default "public, max-age=0, s-maxage=60";
  404 "no-store";
  410 "no-store";
}

map $status $skew_plugins_cache {
  default "public, max-age=0, s-maxage=60";
  404 "no-store";
  410 "no-store";
}

map $cookie_sb_demo $skew_demo_id {
  default "";
  "~^[a-f0-9]{32}$" $cookie_sb_demo;
}

# --- marketing ---
server {
  listen 8081 default_server;
  server_name skewstone.com;
  root /srv/skewstone/marketing;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  charset utf-8;
  absolute_redirect off;
  if ($host = www.skewstone.com) {
    return 301 https://skewstone.com$request_uri;
  }
  add_header Cache-Tag "www" always;
  add_header Cache-Control $skew_www_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
}

# --- docs ---
server {
  listen 8082 default_server;
  server_name docs.skewstone.com;
  root /srv/skewstone/docs;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  charset utf-8;
  absolute_redirect off;
  add_header Cache-Tag "docs" always;
  add_header Cache-Control $skew_docs_html_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
  location /assets/ {
    add_header Cache-Tag "docs" always;
    add_header Cache-Control $skew_docs_asset_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  location ~* /index\.json$ {
    add_header Cache-Tag "docs" always;
    add_header Cache-Control $skew_index_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}

# --- plugins ---
server {
  listen 8083 default_server;
  server_name plugins.skewstone.com;
  root /srv/skewstone/plugins;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  charset utf-8;
  absolute_redirect off;
  add_header Cache-Tag "plugins-index" always;
  add_header Cache-Control $skew_plugins_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
  location /packages/ {
    add_header Cache-Tag "plugins-index" always;
    add_header Cache-Control $skew_docs_asset_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
  location ~* /index\.json$ {
    add_header Cache-Tag "plugins-index" always;
    add_header Cache-Control $skew_index_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}

# --- demo-site ---
# Published pages for one visitor. A missing or invalid sb_demo cookie, or a missing sandbox
# directory, falls through to the golden snapshot. Paths are selected with try_files.
server {
  listen 8084 default_server;
  server_name demo.skewstone.com;
  root /var/lib/skewstone/demo;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  charset utf-8;
  absolute_redirect off;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control $skew_www_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  location = /robots.txt {
    default_type text/plain;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    return 200 "User-agent: *\nDisallow: /\n";
  }
  location / {
    try_files /sandboxes/$skew_demo_id/site/current$uri /sandboxes/$skew_demo_id/site/current$uri/index.html /golden/site/current$uri /golden/site/current$uri/index.html =404;
  }
  location ~ ^/media/(.+)$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $skew_docs_asset_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files /sandboxes/$skew_demo_id/media/renditions/$1 /golden/media/renditions/$1 =404;
  }
}

# --- demo-admin ---
server {
  listen 8085 default_server;
  server_name demo-admin.skewstone.com;
  client_max_body_size 30m;
  include /etc/nginx/cloudflare-real-ip.conf;

  location /_nuxt/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $skew_forwarded_proto;
    proxy_set_header CF-Connecting-IP "";
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $skew_forwarded_proto;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://127.0.0.1:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
