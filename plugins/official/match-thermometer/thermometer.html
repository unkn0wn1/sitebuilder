<section class="match-block">
  <h2 class="match-heading">{{heading}}</h2>
  <p>{{money raised currency}}</p>
  <p>{{fill.percent}}</p>
  <svg viewBox="0 0 40 320" role="img" aria-label="Match progress">
    <rect class="match-tube" x="10" y="14" width="20" height="290"></rect>
    <rect class="match-raised" x="10" y="{{fill.yD}}" width="20" height="{{fill.hD}}"></rect>
    <rect class="match-matched" x="10" y="{{fill.yM}}" width="20" height="{{fill.hM}}"></rect>
  </svg>
</section>
